name: Build Glass APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "META-INF/.*\.(RSA|DSA|EC)$"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
